<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>3D LED Pyramid Viewer</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #222;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.158.0';
    import { OrbitControls } from 'https://esm.sh/three@0.158.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const sectionConfig = {
      A: { segments: 8, ledsPerSegment: 30 }, // Radii from center to octagon vertices
      B: { segments: 8, ledsPerSegment: 22 }, // Sides of the octagon 
      C: { segments: 8, ledsPerSegment: 60 }  // Sides of the pyramid
    };

    const sectionMap = { A: [], B: [], C: [] };

    function generateColorArray(n) {
      const colors = [];
      for (let i = 0; i < n; i++) {
        const hue = i / n;
        const color = new THREE.Color().setHSL(hue, 1.0, 0.5);
        colors.push(color);
      }
      return colors;
    }

    function addSegmentedLine(start, end, leds, sectionId) {
      const colorArray = Array(leds).fill().map(() => new THREE.Color(0, 0, 0)); // All black
      const N = colorArray.length;
      const dir = new THREE.Vector3().subVectors(end, start).divideScalar(N);
      const points = [];
      const vertexColors = [];

      for (let i = 0; i < N; i++) {
        const p1 = new THREE.Vector3().copy(start).add(dir.clone().multiplyScalar(i));
        const p2 = new THREE.Vector3().copy(start).add(dir.clone().multiplyScalar(i + 1));
        points.push(p1, p2);

        const c = colorArray[i];
        vertexColors.push(c.r, c.g, c.b);
        vertexColors.push(c.r, c.g, c.b);
      }

      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(vertexColors, 3));
      const material = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 3 });
      const line = new THREE.LineSegments(geometry, material);
      scene.add(line);
      sectionMap[sectionId].push(line);
    }

    function updateLineColors(line, colorArray) {
      const attr = line.geometry.getAttribute('color');
      for (let i = 0; i < colorArray.length; i++) {
        const idx = i * 2 * 3;
        const c = colorArray[i];
        for (let j = 0; j < 2; j++) {
          attr.array[idx + j * 3 + 0] = c.r;
          attr.array[idx + j * 3 + 1] = c.g;
          attr.array[idx + j * 3 + 2] = c.b;
        }
      }
      attr.needsUpdate = true;
    }

    function applyToSection(sectionId, pixelData) {
      const config = sectionConfig[sectionId];
      const segments = sectionMap[sectionId];
      for (let i = 0; i < 8; i++) {
        const line = segments[i];
        const offset = i * config.ledsPerSegment * 3;
        const segmentData = pixelData.slice(offset, offset + config.ledsPerSegment * 3);

        const colors = [];
        for (let j = 0; j < config.ledsPerSegment; j++) {
          const g = segmentData[j * 3];
          const r = segmentData[j * 3 + 1];
          const b = segmentData[j * 3 + 2];
          colors.push(new THREE.Color(r / 255, g / 255, b / 255));
        }

        updateLineColors(line, colors);
      }
    }

    function applyToSegment(sectionId, segmentIndex, pixelData) {
      const config = sectionConfig[sectionId];
      const line = sectionMap[sectionId][segmentIndex];

      const colors = [];
      for (let j = 0; j < config.ledsPerSegment; j++) {
        const g = pixelData[j * 3];
        const r = pixelData[j * 3 + 1];
        const b = pixelData[j * 3 + 2];
        colors.push(new THREE.Color(r / 255, g / 255, b / 255));
      }

      updateLineColors(line, colors);
    }

    function clearAllLines() {
      for (const sectionId in sectionMap) {
        const black = new THREE.Color(0, 0, 0);
        for (const line of sectionMap[sectionId]) {
          updateLineColors(line, Array(sectionConfig[sectionId].ledsPerSegment).fill(black));
        }
      }
    }

    // Geometry setup
    const octagon = [];
    const radius = 3;
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      octagon.push(new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius));
    }

    const center = new THREE.Vector3(0, 0, 0);
    const apex = new THREE.Vector3(0, 4, 0);

    for (let i = 0; i < 8; i++) {
      const next = (i + 1) % 8;

      // Section B: Octagon edges (22 LEDs)
      addSegmentedLine(octagon[i], octagon[next], sectionConfig.B.ledsPerSegment, 'B');

      // Section C: Pyramid sides (60 LEDs)
      addSegmentedLine(octagon[i], apex, sectionConfig.C.ledsPerSegment, 'C');

      // Section A: Center radii (30 LEDs)
      addSegmentedLine(center, octagon[i], sectionConfig.A.ledsPerSegment, 'A');
    }

    // WebSocket integration
    const socket = new WebSocket(`ws://${location.host}/ws/leds`);
    socket.binaryType = "arraybuffer";

    socket.onmessage = function (event) {
      const sectionIdMap = ['A', 'B', 'C'];
      const data = new Uint8Array(event.data);
      const type = data[0];
      const sectionId = sectionIdMap[data[1]];
      const payloadLen = (data[2] << 8) | data[3];

      if (type === 0) {
        clearAllLines();
      } else if (type === 1) {
        const pixelData = data.slice(4, 4 + payloadLen);
        applyToSection(sectionId, pixelData);
      } else if (type === 2) {
        const ledsPerSegment = sectionConfig[sectionId].ledsPerSegment;
        const segmentDataLength = ledsPerSegment * 3;
        const segmentCount = payloadLen - segmentDataLength;

        const segmentIds = data.slice(4, 4 + segmentCount);
        const colorStart = 4 + segmentCount;
        const segmentData = data.slice(colorStart, colorStart + segmentDataLength);

        for (let i = 0; i < segmentIds.length; i++) {
          applyToSegment(sectionId, segmentIds[i], segmentData);
        }
      }
    };

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
