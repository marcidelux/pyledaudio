<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>MUMUSH EYE</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="row">
        <div id="power-sw" class="flex-1"></div>
        <div id="brightness-sb" class="flex-3"></div>
    </div>

    <div class="row">
        <div id="primary-effect" class="flex-3"></div>
        <div id="secondary-effect" class="flex-3"></div>
        <div id="add-effect-bt" class="flex-1"></div>
    </div>

    <div class="row">
        <div id="new-effect-list-name" class="flex-2"></div>
        <div id="add-effect-list-bt" class="flex-1"></div>
    </div>

    <div class="row">
        <div id="current-effects-list" class="flex-3"></div>
        <div id="prev-effect-bt" class="flex-1"></div>
        <div id="next-effect-bt" class="flex-1"></div>
        <div id="delete-effect-list-bt" class="flex-1"></div>
    </div>

    <div id="effects-list-view"></div>

    <div class="row">
        <div class="flex-1">
            <iframe src="pyramid.html" width="100%" height="500"></iframe>
        </div>
        <div class="flex-1">
            <iframe src="bands.html" width="100%" height="500"></iframe>
        </div>
    </div>

    <script src="controls.js"></script>
    <script type="module" src="logic.js"></script>
</body>

</html>
